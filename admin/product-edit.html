<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Product - Probation Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="admin-sidebar-brand">
        PROBATION
        <small>Admin Panel</small>
      </div>
      <nav class="admin-nav">
        <a href="/admin/dashboard.html">
          <svg viewBox="0 0 24 24"><path d="M3 3h7v7H3zM14 3h7v7h-7zM14 14h7v7h-7zM3 14h7v7H3z"/></svg>
          Dashboard
        </a>
        <a href="/admin/products.html">
          <svg viewBox="0 0 24 24"><path d="M16.5 9.4l-9-5.19M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
          Products
        </a>
        <a href="/admin/orders.html">
          <svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
          Orders
        </a>
        <a href="#" id="logoutBtn">
          <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Logout
        </a>
      </nav>
    </aside>
    <div class="admin-sidebar-overlay"></div>
    <main class="admin-main">
      <div class="admin-header">
        <div class="flex">
          <button class="admin-toggle">
            <span></span><span></span><span></span>
          </button>
          <h1 id="pageTitle">Add Product</h1>
        </div>
      </div>

      <div class="admin-card">
        <form id="productForm">
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Name</label>
              <input type="text" id="name" class="form-input" required>
            </div>
            <div class="form-group">
              <label class="form-label">Slug</label>
              <input type="text" id="slug" class="form-input">
            </div>
          </div>
          
          <div class="form-group">
            <label class="form-label">Description</label>
            <textarea id="description" class="form-textarea" required></textarea>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Price</label>
              <input type="number" step="0.01" id="price" class="form-input" required>
            </div>
            <div class="form-group">
              <label class="form-label">Compare Price (Optional)</label>
              <input type="number" step="0.01" id="compare_price" class="form-input">
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Category</label>
            <select id="category" class="form-select" required>
              <option value="hoodie">Hoodie</option>
              <option value="joggers">Joggers</option>
              <option value="set">Set</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">Stock (Sizes)</label>
            <div class="form-row">
              <div>
                <label>S</label>
                <input type="number" id="stockS" class="form-input" value="0" min="0">
              </div>
              <div>
                <label>M</label>
                <input type="number" id="stockM" class="form-input" value="0" min="0">
              </div>
              <div>
                <label>L</label>
                <input type="number" id="stockL" class="form-input" value="0" min="0">
              </div>
              <div>
                <label>XL</label>
                <input type="number" id="stockXL" class="form-input" value="0" min="0">
              </div>
              <div>
                <label>XXL</label>
                <input type="number" id="stockXXL" class="form-input" value="0" min="0">
              </div>
            </div>
          </div>

          <div class="form-row" style="margin-bottom: 16px;">
            <div class="form-group flex">
              <label class="toggle-switch">
                <input type="checkbox" id="featured">
                <span class="toggle-slider"></span>
              </label>
              <span style="margin-left:8px; font-weight:600;">Featured</span>
            </div>
            <div class="form-group flex">
              <label class="toggle-switch">
                <input type="checkbox" id="active" checked>
                <span class="toggle-slider"></span>
              </label>
              <span style="margin-left:8px; font-weight:600;">Active</span>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Images (Upload to Supabase Storage)</label>
            <div class="image-upload-zone" id="imageUploadZone">
              <p>Drag & Drop or Click to Upload</p>
              <input type="file" id="imageInput" multiple accept="image/*" class="hidden">
            </div>
            <div class="image-preview-grid" id="imagePreviewGrid"></div>
          </div>

          <button type="submit" class="btn btn-primary" id="saveBtn">Save Product</button>
        </form>
      </div>
    </main>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script type="module" src="../js/admin/auth.js"></script>
  <script type="module" src="../js/admin/products.js"></script>
</body>
</html>
