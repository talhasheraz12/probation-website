<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dashboard - Probation Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="admin-sidebar-brand">
        PROBATION
        <small>Admin Panel</small>
      </div>
      <nav class="admin-nav">
        <a href="/admin/dashboard.html">
          <svg viewBox="0 0 24 24"><path d="M3 3h7v7H3zM14 3h7v7h-7zM14 14h7v7h-7zM3 14h7v7H3z"/></svg>
          Dashboard
        </a>
        <a href="/admin/products.html">
          <svg viewBox="0 0 24 24"><path d="M16.5 9.4l-9-5.19M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
          Products
        </a>
        <a href="/admin/orders.html">
          <svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
          Orders
        </a>
        <a href="#" id="logoutBtn">
          <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Logout
        </a>
      </nav>
    </aside>
    <div class="admin-sidebar-overlay"></div>
    <main class="admin-main">
      <div class="admin-header">
        <div class="flex">
          <button class="admin-toggle">
            <span></span><span></span><span></span>
          </button>
          <h1>Dashboard</h1>
        </div>
      </div>

      <div class="admin-stats">
        <div class="admin-stat">
          <div class="admin-stat-value" id="statOrders"><div class="loading-spinner"></div></div>
          <div class="admin-stat-label">Total Orders</div>
        </div>
        <div class="admin-stat">
          <div class="admin-stat-value" id="statPending"><div class="loading-spinner"></div></div>
          <div class="admin-stat-label">Pending Orders</div>
        </div>
        <div class="admin-stat">
          <div class="admin-stat-value" id="statRevenue"><div class="loading-spinner"></div></div>
          <div class="admin-stat-label">Total Revenue</div>
        </div>
        <div class="admin-stat">
          <div class="admin-stat-value" id="statProducts"><div class="loading-spinner"></div></div>
          <div class="admin-stat-label">Total Products</div>
        </div>
      </div>

      <div class="admin-card">
        <div class="admin-card-header">
          <h3>Recent Orders</h3>
        </div>
        <div class="admin-table-wrapper">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Order #</th>
                <th>Customer</th>
                <th>City</th>
                <th>Total</th>
                <th>Status</th>
                <th>Date</th>
              </tr>
            </thead>
            <tbody id="recentOrdersTable">
              <!-- JS rendered -->
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
  <script type="module" src="../js/admin/auth.js"></script>
  <script type="module">
    import { supabase, formatPrice } from '../js/supabase-config.js';

    async function loadDashboard() {
      // Products count
      const { count: productCount } = await supabase.from('products').select('*', { count: 'exact', head: true });
      document.getElementById('statProducts').textContent = productCount || 0;

      // Orders stats
      const { data: orders } = await supabase.from('orders').select('*').order('created_at', { ascending: false });
      if (orders) {
        document.getElementById('statOrders').textContent = orders.length;
        document.getElementById('statPending').textContent = orders.filter(o => o.status === 'pending').length;
        const totalRevenue = orders.reduce((sum, o) => sum + Number(o.total), 0);
        document.getElementById('statRevenue').textContent = formatPrice(totalRevenue);

        const recentOrdersTable = document.getElementById('recentOrdersTable');
        orders.slice(0, 10).forEach(order => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>#${order.order_number}</td>
            <td>${order.customer_name}</td>
            <td>${order.city}</td>
            <td>${formatPrice(order.total)}</td>
            <td><span class="status-badge status-${order.status}">${order.status}</span></td>
            <td>${new Date(order.created_at).toLocaleDateString()}</td>
          `;
          recentOrdersTable.appendChild(tr);
        });
      }
    }
    loadDashboard();
  </script>
</body>
</html>
